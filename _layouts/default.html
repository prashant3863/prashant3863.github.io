<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    {% include head.html %}
</head>

<body class="ns-page">
    <div class="ns-container">
        {% include header.html %}
        {{ content }}
    </div>

    {%- comment -%} Motion: the logo on every page; the rest only where a page asks via `ns_js`. {%- endcomment %}
    <script src="{{ "/assets/js/ns-logo.js" | relative_url }}" defer></script>
    {%- for js in page.ns_js %}
    <script src="{{ "/assets/js/ns-" | append: js | append: ".js" | relative_url }}" defer></script>
    {%- endfor %}
</body>

</html>
