<style>
    /* Reusable post components. Inline so Tailwind's purge never strips them.
     * Colours come from the notshant tokens (design/tokens.css). The accent is the glider's light green:
     * --c-accent for rules and borders, --c-tint behind the key idea. Neither is ever text on white.
     * It replaced the red #e3120b (design/brand.md → Colour). Weights stop at 600. */
    article.ns-prose {
        --c-accent: var(--ns-mint-light);
        --c-ink: var(--ns-ink);
        --c-muted: var(--ns-muted);
        --c-rule: var(--ns-rule);
        --c-tint: var(--ns-mint-wash);
    }

    /* Pull-quote style facts with a source line underneath */
    article.ns-prose blockquote.fact {
        font-size: 1.15em; line-height: 1.5; font-weight: 500; color: var(--c-ink);
        border-left: 3px solid var(--c-accent); padding-left: 1em;
    }
    article.ns-prose p.cite { font-size: 0.8em; color: var(--c-muted); margin-top: -0.75em; }
    article.ns-prose p.cite a { color: var(--c-muted); }

    /* The key idea of a post: large, bold, set apart */
    article.ns-prose p.c-key {
        font-size: 1.15em; line-height: 1.5; font-weight: 600; color: var(--c-ink);
        background: var(--c-tint); border-left: 3px solid var(--c-accent);
        padding: 1.1rem 1.35rem; margin: 2rem 0; border-radius: var(--ns-radius-sm);
    }

    /* Subtitle directly under the post's H1 */
    article.ns-prose p.c-subtitle {
        font-size: 1em; line-height: 1.5; color: var(--c-muted); font-weight: 400;
        margin-top: -0.3em; margin-bottom: 1.75em;
    }

        /* Big standalone line, no quote marks */
    article.ns-prose p.pull {
        font-size: 1.3em; line-height: 1.35; font-weight: 600; color: var(--c-ink);
        border-top: 3px solid var(--c-accent); padding-top: 0.75em; margin: 2.5rem 0;
        max-width: 32ch;
    }

    /* Numbered section headings */
    article.numbered { counter-reset: section; }
    article.numbered h3 {
        counter-increment: section;
        border-top: 1px solid var(--c-rule); padding-top: 1.75rem; margin-top: 3rem;
    }
    article.numbered h3::before {
        content: counter(section, decimal-leading-zero);
        display: block; font-family: var(--ns-mono); font-size: var(--ns-text-meta); font-weight: 400; letter-spacing: 0.04em;
        color: var(--c-muted); margin-bottom: 0.5rem;
    }

    /* Long posts: headings a clear step above the 17px body (design/system.md, round 17) */
    article.numbered h1 {
        font-size: clamp(28px, 3.6vw, 36px); line-height: 1.2; font-weight: 600; letter-spacing: -0.02em;
        margin-bottom: 0.45em;
    }
    article.numbered p.c-subtitle { font-size: 1.1em; }
    article.numbered h3 {
        font-size: clamp(22px, 2.6vw, 26px); line-height: 1.3; font-weight: 600; letter-spacing: -0.015em;
        margin-bottom: 0.75em;
    }
    article.numbered h4 { font-size: 20px; line-height: 1.4; margin: 2.2em 0 0.5em; }
    article.numbered h3 + h4 { margin-top: 0.9em; }

    /* The contents box numbers its sections the way the headings do (01, 02 …) */
    article.numbered .c-summary > ol { list-style: decimal-leading-zero; padding-left: 2.1em; }
    article.numbered .c-summary > ol > li::marker { font-family: var(--ns-mono); font-size: 0.9em; }

    /* Generic card and grids */
    article.ns-prose .c-grid { display: grid; gap: 1rem; margin: 1.5rem 0; }
    article.ns-prose .c-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    article.ns-prose .c-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    @media (max-width: 640px) {
        article.ns-prose .c-grid-2, article.ns-prose .c-grid-3 { grid-template-columns: 1fr; }
    }
    article.ns-prose .c-card {
        border: 1px solid var(--c-rule); border-top: 2px solid var(--c-ink);
        border-radius: var(--ns-radius-sm); padding: 1rem 1.1rem; background: var(--ns-bg);
    }
    article.ns-prose .c-card > :first-child { margin-top: 0; }
    article.ns-prose .c-card > :last-child { margin-bottom: 0; }
    article.ns-prose .c-card p { margin: 0.4em 0; font-size: 0.95em; }
    article.ns-prose .c-label {
        display: block; font-size: 0.72em; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--c-muted); margin-bottom: 0.25rem;
    }
    article.ns-prose .c-card .c-title { font-weight: 600; font-size: 1.05em; color: var(--c-ink); }
    /* A card with a fix line is a column, so the fix sits at the bottom of every card in a row */
    article.ns-prose .c-card:has(.c-fix) { display: flex; flex-direction: column; }
    article.ns-prose .c-card p.c-fix {
        margin-top: auto; margin-bottom: 0;
        border-top: 1px solid var(--c-rule); padding-top: 0.5em; font-weight: 600;
    }
    article.ns-prose .c-card:has(.c-fix) p:nth-last-child(2) { margin-bottom: 0.9em; }

    /* "In this post" summary box, kept quiet so the key idea leads */
    article.ns-prose .c-summary {
        border: 1px solid var(--c-rule); border-radius: var(--ns-radius-sm);
        padding: 0.75rem 1.1rem; margin: 1.5rem 0; font-size: 0.9em;
    }
    article.ns-prose .c-summary .c-label { color: var(--c-muted); }
    article.ns-prose .c-summary ol { margin: 0.25rem 0 0; }
    article.ns-prose .c-summary li { margin: 0.1rem 0; }
    article.ns-prose .c-summary a { color: var(--c-muted); }
    /* A section's sub-headings sit on one line under it, separated by dots */
    article.ns-prose .c-summary li > ul { display: flex; flex-wrap: wrap; list-style: none; padding: 0; margin: 0.1rem 0 0.35rem; font-size: 0.92em; }
    article.ns-prose .c-summary li > ul > li { margin: 0; }
    article.ns-prose .c-summary li > ul > li:not(:last-child)::after { content: "·"; margin: 0 0.55em; color: var(--ns-faint); }

    /* Numbered step cards */
    article.ns-prose .c-step {
        display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 1rem;
        border-top: 1px solid var(--c-rule); padding: 1.25rem 0;
    }
    article.ns-prose .c-step:last-of-type { border-bottom: 1px solid var(--c-rule); }
    article.ns-prose .c-step-num {
        width: 2.5rem; height: 2.5rem; border-radius: 999px; background: var(--c-ink); color: var(--ns-bg);
        display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1em;
    }
    article.ns-prose .c-step-body > :first-child { margin-top: 0.3rem; }
    article.ns-prose .c-step-body > :last-child { margin-bottom: 0; }
    article.ns-prose .c-step-body h4 { margin-top: 0.2rem; }

    /* Checklist */
    article.ns-prose ul.c-check {
        list-style: none; padding-left: 0; display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 2rem; row-gap: 0.6rem;
    }
    @media (max-width: 640px) { article.ns-prose ul.c-check { grid-template-columns: 1fr; } }
    article.ns-prose ul.c-check li { position: relative; padding-left: 1.8rem; margin: 0; }
    article.ns-prose ul.c-check li::before {
        content: ""; position: absolute; left: 0; top: 0.35em; width: 1rem; height: 1rem;
        border: 2px solid var(--c-ink); border-radius: 3px; background: none;
    }

    /* Highlight callout, e.g. the AI multiplier */
    article.ns-prose .c-callout {
        display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.5rem; align-items: center;
        background: var(--ns-callout-bg); color: var(--ns-callout-ink); border-radius: var(--ns-radius-md); padding: 1.5rem 1.75rem; margin: 2rem 0;
    }
    @media (max-width: 640px) { article.ns-prose .c-callout { grid-template-columns: 1fr; } }
    article.ns-prose .c-callout .c-big { font-size: 3em; font-weight: 600; line-height: 1; color: var(--ns-callout-ink); }
    article.ns-prose .c-callout p { margin: 0.3em 0; color: var(--ns-callout-ink); opacity: .9; }
    article.ns-prose .c-callout strong { color: var(--ns-callout-ink); }
    article.ns-prose .c-callout .c-label { color: var(--ns-mint-light); }   /* light green reads well on ink (10:1) */
</style>
