# Photographs, one entry per series, newest first. Spec: design/system.md → Content structure.
# Files: assets/photos/<folder>/NN.jpg (1600px) and NN-s.jpg (720px).
# `home: true` puts a photo in the four-photo strip on the home page (use four in total).
# A long trip can be split into `stops` (each a `name` and its `photos`). Files are numbered through the whole series.

# Italy, September 2025. Camera JPEGs as shot, picked in Photos (hearts). Stops in route order.
