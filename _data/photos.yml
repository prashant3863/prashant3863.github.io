# Photographs, grouped into collections. Spec: design/system.md → Content structure → Photographs.
# Each collection gets its own page at /photos/<slug>/ (made by _plugins/photo_collections.rb, so no page file is
# needed), and /photos/ lists the collections in this order. A collection can be a place, a trip, or a theme.
#
# A collection: `title`, `slug` (its URL), optional `intro` (one line under the title), and `series`.
# A series is one section of the page, e.g. one trip: `title` and `meta` (both optional), `folder` (its folder on
# R2), `large: true` when it has 3200px files, and `photos`, or `stops` (each a `name` and its `photos`, in order).
# Files live on Cloudflare R2 (site.photos_url): <folder>/<file>.jpg (1600px), <file>-s.jpg (720px), and
# <file>-l.jpg (3200px) when the series has `large: true`. Made and uploaded with scripts/photos.py. A file name is
# never reused for a different photo (the files are cached for a year), so new photos are named after the camera
# file: dscf1229.
# On a photo: `cover: true` puts it in its collection's preview on /photos/ (up to four; without any, the first
# four), and `home: true` puts it in the four-photo strip on the home page (use four in total).

- title: Italy
  slug: italy
  series:
    # Italy, September 2025. Camera JPEGs as shot, picked in Photos (hearts). Stops in route order.
