google_analytics: G-JGZRXWFK8F
# Cloudflare Web Analytics (_includes/scripts.html). The token is public: it ends up in every page.
cloudflare_analytics_token: 103f07f4e916416aafb97b5d43847c19

title: Not Shant Blog
description: Personal Blog of Prashant Mittal
url: https://notshant.xyz
# Photographs are served from Cloudflare R2 (docs/domain-dns-and-photo-hosting.md). No trailing slash.
photos_url: https://photos.notshant.xyz
twitter:
  username: prashant_mit
  card: summary_large_image

# Lab notes (design/system.md → Content structure). The "notes" nav item appears once this has a note in it.
collections:
  notes:
    output: true
    permalink: /notes/:name

defaults:
  - scope:
      path: "assets/estimates/deck.html"
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      nav: writing
  - scope:
      path: ""
      type: notes
    values:
      layout: post
      nav: notes

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude: [
  styles/index.css,
  styles/syntax.css,
  package.json,
  package-lock.json,
  postcss.config.js,
  readme.md,
  CLAUDE.md,
  design,
  docs,
  scripts,
]
