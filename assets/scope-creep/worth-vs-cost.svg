<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2a2a2a}.k{font-size:15px;fill:#6e6e6e;letter-spacing:.1em}.q{font-family:Georgia,serif;font-style:italic;font-size:24px;fill:#121212}.v{font-family:Georgia,serif;font-size:30px;font-weight:600;fill:#121212}.h{font-family:Georgia,serif;font-size:26px;font-weight:600;fill:#121212}.t{font-size:20px;fill:#2a2a2a}.s{font-size:17px;fill:#6e6e6e}</style>
<rect width="1200" height="430" fill="#fff"/>
<text x="30" y="60" class="k">WHAT FINANCE SAYS</text><text x="30" y="92" class="q">Six hours a week, a year</text><rect x="400" y="45" width="770" height="56" fill="#7d97b5"/><text x="1155" y="85" class="v" text-anchor="end" style="fill:#fff">300 h</text><text x="30" y="170" class="k">IF THEY'RE OFF BY TWO THIRDS</text><text x="30" y="202" class="q">A third of that</text><rect x="400" y="155" width="257" height="56" fill="#c3d0dc"/><text x="642" y="195" class="v" text-anchor="end" style="fill:#121212">100 h</text><text x="30" y="280" class="k">WHAT THE FULL EXPORT COSTS</text><text x="30" y="312" class="q">Four days</text><rect x="400" y="265" width="82" height="56" fill="#3e4c6e"/><text x="497" y="305" class="v">32 h</text><line x1="400" y1="375" x2="1170" y2="375" stroke="#121212" stroke-width="2"/><text x="400" y="408" class="k">0</text><text x="785" y="408" class="k" text-anchor="middle">HOURS A YEAR, ILLUSTRATIVE</text><text x="1170" y="408" class="k" text-anchor="end">300</text>
</svg>
