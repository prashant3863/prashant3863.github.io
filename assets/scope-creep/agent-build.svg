<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2a2a2a}.k{font-size:15px;fill:#6e6e6e;letter-spacing:.1em}.q{font-family:Georgia,serif;font-style:italic;font-size:24px;fill:#121212}.v{font-family:Georgia,serif;font-size:30px;font-weight:600;fill:#121212}.h{font-family:Georgia,serif;font-size:26px;font-weight:600;fill:#121212}.t{font-size:20px;fill:#2a2a2a}.s{font-size:17px;fill:#6e6e6e}</style>
<rect width="1200" height="310" fill="#fff"/>
<text x="30" y="66" class="h">By hand</text><text x="30" y="92" class="s">the bulk export</text><rect x="330" y="40" width="360" height="60" fill="#3e4c6e" stroke="#fff" stroke-width="2"/><text x="510" y="77" class="t" text-anchor="middle" style="fill:#fff">Build, 2 days</text><rect x="690" y="40" width="180" height="60" fill="#7d97b5" stroke="#fff" stroke-width="2"/><text x="780" y="77" class="t" text-anchor="middle" style="fill:#fff">Test</text><rect x="870" y="40" width="180" height="60" fill="#c3d0dc" stroke="#fff" stroke-width="2"/><text x="960" y="77" class="t" text-anchor="middle" style="fill:#121212">Release</text><text x="1065" y="80" class="v">4 days</text><text x="30" y="176" class="h">With an agent</text><text x="30" y="202" class="s">same export</text><rect x="330" y="150" width="90" height="60" fill="#3e4c6e" stroke="#fff" stroke-width="2"/><text x="375" y="187" class="t" text-anchor="middle" style="fill:#fff"></text><rect x="420.0" y="150" width="180" height="60" fill="#7d97b5" stroke="#fff" stroke-width="2"/><text x="510" y="187" class="t" text-anchor="middle" style="fill:#fff">Test</text><rect x="600.0" y="150" width="180" height="60" fill="#c3d0dc" stroke="#fff" stroke-width="2"/><text x="690" y="187" class="t" text-anchor="middle" style="fill:#121212">Release</text><text x="795" y="190" class="v">2.5 days</text><text x="330" y="235" class="s">Build, an afternoon</text><text x="30" y="290" class="s">Illustrative. The agent shrinks the build; testing and release stay the same size.</text>
