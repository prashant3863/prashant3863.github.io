<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#2a2a2a}.t{font-family:Georgia,serif;font-size:22px;font-weight:600;fill:#121212}.s{font-size:17px;fill:#6e6e6e}.k{font-size:14px;fill:#6e6e6e;letter-spacing:.1em}.w{fill:#fff;font-size:15px;font-weight:600;letter-spacing:.08em}</style>
<rect width="1200" height="470" fill="#fff"/>
<!-- range width bars (P50 to P85 spread) -->
<text x="30" y="40" class="k">HOW WIDE IS THE RANGE?</text>
<rect x="30" y="60" width="60" height="14" fill="#3e4c6e"/>
<rect x="320" y="60" width="130" height="14" fill="#3e4c6e"/>
<rect x="610" y="60" width="200" height="14" fill="#3e4c6e"/>
<rect x="900" y="60" width="270" height="14" fill="#3e4c6e"/>
<!-- steps -->
<rect x="30" y="300" width="270" height="130" fill="#c3d0dc"/>
<rect x="320" y="240" width="270" height="190" fill="#9fb3c9"/>
<rect x="610" y="180" width="270" height="250" fill="#7d97b5"/>
<rect x="900" y="120" width="270" height="310" fill="#3e4c6e"/>
<text x="50" y="340" class="t">Fixed price</text>
<text x="50" y="368" class="s">Mostly known work.</text>
<text x="50" y="390" class="s">Overrun is yours.</text>
<text x="340" y="280" class="t">With checkpoints</text>
<text x="340" y="308" class="s">Re-look at scope at</text>
<text x="340" y="330" class="s">agreed points.</text>
<text x="630" y="220" class="t" style="fill:#fff">Target cost</text>
<text x="630" y="248" class="s" style="fill:#eef2f7">Overruns and savings</text>
<text x="630" y="270" class="s" style="fill:#eef2f7">split by a set ratio.</text>
<text x="920" y="160" class="t" style="fill:#fff">Time &amp; materials</text>
<text x="920" y="188" class="s" style="fill:#eef2f7">Flexible scope,</text>
<text x="920" y="210" class="s" style="fill:#eef2f7">capped budget.</text>
<line x1="30" y1="445" x2="1170" y2="445" stroke="#121212" stroke-width="2"/>
<text x="30" y="465" class="k">NARROW RANGE</text><text x="1170" y="465" class="k" text-anchor="end">WIDE RANGE</text>
</svg>
