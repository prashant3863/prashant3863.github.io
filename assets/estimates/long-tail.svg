        <g class="ax" text-anchor="middle">
          <text x="252" y="556">0%</text><text x="692" y="556">+100%</text><text x="1132" y="556">+200%</text><text x="1572" y="556">+300%</text>
        </g>
        <g stroke="#6e6e6e" stroke-width="1.5"><line x1="252" y1="520" x2="252" y2="530"/><line x1="692" y1="520" x2="692" y2="530"/><line x1="1132" y1="520" x2="1132" y2="530"/><line x1="1572" y1="520" x2="1572" y2="530"/></g>
        <text x="920" y="592" text-anchor="middle" class="axu">Cost overrun against the original budget</text>
        <path d="M120,518 C200,515 230,120 296,120 C360,120 420,330 516,380 C600,425 640,448 692,455 C900,480 1300,505 1704,512 L1704,520 L120,520 Z" fill="#c3d0dc"/>
        <path d="M692,455 C900,480 1300,505 1704,512 L1704,520 L692,520 Z" fill="#3e4c6e"/>
        <path d="M120,518 C200,515 230,120 296,120 C360,120 420,330 516,380 C600,425 640,448 692,455 C900,480 1300,505 1704,512" fill="none" stroke="#3e4c6e" stroke-width="2.5"/>
        <line x1="371" y1="90" x2="371" y2="520" stroke="#121212" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="390" y="100" class="sr">Average: +27%</text>
