        </g>
        <text x="420" y="146" text-anchor="middle" class="b">Best: 10 days</text>
        <text x="555" y="30" text-anchor="end" class="b">Likely: 15</text>
        <text x="660" y="30" class="b red">Expected: 17.5</text>
